name: dbt_test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dbt_test
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d dbt_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  dbt-ui-backend:
    profiles: ["ui"]
    build:
      context: ./.tools/dbt-ui
      dockerfile: ../../docker/dbt-ui-backend.Dockerfile
      additional_contexts:
        host_certificates: /usr/local/share/ca-certificates
    environment:
      PYTHONUNBUFFERED: "1"
      DBT_UI__FRONTEND_URL: http://localhost:8080
      DBT_UI__SCHEDULER_ENABLED: "false"
      DBT_UI__METADV_ENABLED: "false"
      DBT_POSTGRES_HOST: postgres
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    command:
      - /bin/sh
      - -ec
      - |
        export DBT_ENV_SECRET_POSTGRES_PASSWORD="$$(cat /run/secrets/postgres_password)"
        exec python main.py
    volumes:
      - dbt_ui_repos:/home/dbtui/git-repos
      - ./analytics:/home/dbtui/git-repos/analytics
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  dbt-ui:
    profiles: ["ui"]
    build:
      context: ./.tools/dbt-ui
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DBT_UI__BACKEND_URL: http://dbt-ui-backend:8000
    depends_on:
      dbt-ui-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  dbt_ui_repos:

secrets:
  postgres_password:
    file: ./.postgres-password
